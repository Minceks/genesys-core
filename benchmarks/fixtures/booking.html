<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Booking benchmark</title><link rel="stylesheet" href="styles.css"><header><strong>Still Studio</strong><nav><a href="#booking">Book a visit</a></nav></header><main><p>Time for yourself</p><h1>A calmer appointment.</h1><p>Book and cancel a browser-local demonstration appointment. No external messages are sent.</p><section data-genesys-workflow="appointments" id="booking" class="grid"><form id="form"><h2>Book your appointment</h2><label>Customer name<input id="customer" required></label><label>Appointment date<input id="date" type="date" required></label><label>Service<select id="service"><option value="consultation">Consultation</option><option value="followup">Follow-up</option></select></label><label>Time<select id="time"><option value="09:00">09:00</option><option value="14:00">14:00</option></select></label><button>Book appointment</button></form><article><h2>Your appointments</h2><ul id="bookings"></ul></article></section></main><script>
let bookings=JSON.parse(localStorage.getItem('benchmark-bookings')||'[]');
function render(){localStorage.setItem('benchmark-bookings',JSON.stringify(bookings));const list=document.querySelector('#bookings');list.replaceChildren();for(const item of bookings){const li=document.createElement('li'),text=document.createElement('span'),cancel=document.createElement('button');text.textContent=item.name+' — '+item.date+' '+item.time;cancel.textContent='Cancel booking';cancel.onclick=()=>{bookings=bookings.filter(b=>b.id!==item.id);render()};li.append(text,cancel);list.append(li)}}
document.querySelector('#form').onsubmit=e=>{e.preventDefault();bookings.push({id:crypto.randomUUID(),name:document.querySelector('#customer').value,date:document.querySelector('#date').value,time:document.querySelector('#time').value});e.target.reset();render()};render();
</script></html>
