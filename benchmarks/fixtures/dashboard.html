<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tasks dashboard benchmark</title><link rel="stylesheet" href="styles.css"><header><strong>Fieldwork</strong><nav><a href="#tasks">Tasks</a><a href="#overview">Overview</a></nav></header><main><section id="overview"><p>Team workspace</p><h1>Make room for focused work.</h1><p>A local task dashboard used to test creation, editing, persistence and reversal.</p></section><section id="tasks" data-genesys-workflow="tasks" class="panel"><h2>Tasks</h2><form id="create"><label>Task title<input id="title" required></label><button>Add task</button></form><ul id="items" aria-label="Tasks"></ul></section></main><script>
let tasks=JSON.parse(localStorage.getItem('benchmark-tasks')||'[]');
function save(){localStorage.setItem('benchmark-tasks',JSON.stringify(tasks));render()}
function button(text,action){const el=document.createElement('button');el.textContent=text;el.onclick=action;return el}
function render(){const list=document.querySelector('#items');list.replaceChildren();for(const task of tasks){const li=document.createElement('li'),title=document.createElement('span');title.textContent=task.title;li.append(title,button('Edit task',()=>{const label=document.createElement('label'),input=document.createElement('input');label.textContent='Edit task title';input.value=task.title;label.append(input);li.replaceChildren(title,label,button('Save task',()=>{task.title=input.value.trim();save()}))}),button('Delete task',()=>{tasks=tasks.filter(t=>t.id!==task.id);save()}));list.append(li)}}
document.querySelector('#create').onsubmit=e=>{e.preventDefault();tasks.push({id:crypto.randomUUID(),title:document.querySelector('#title').value.trim()});e.target.reset();save()};render();
</script></html>
