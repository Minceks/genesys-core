<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Store benchmark</title><link rel="stylesheet" href="styles.css"><header><strong>Everyday Supply</strong><button onclick="document.querySelector('dialog').showModal()">Open cart</button></header><main><p>Thoughtful essentials</p><h1>Carry less. Go further.</h1><p>A sample local storefront. Checkout and real payments are outside this reference fixture.</p><div class="grid"><article><img src="art.svg" alt="Sample product illustration"><h2>Field notebook</h2><p>$12.00</p><button id="add">Add notebook</button></article></div><dialog aria-label="Cart"><h2>Your cart</h2><div id="line"></div><button onclick="this.closest('dialog').close()">Close cart</button></dialog></main><script>
let quantity=Number(localStorage.getItem('benchmark-quantity')||0);function render(){localStorage.setItem('benchmark-quantity',quantity);const line=document.querySelector('#line');line.replaceChildren();if(!quantity){line.textContent='Your cart is empty.';return}const title=document.createElement('p'),label=document.createElement('label'),input=document.createElement('input'),total=document.createElement('p'),remove=document.createElement('button');title.textContent='Field notebook';label.textContent='Quantity';input.type='number';input.min=1;input.value=quantity;input.oninput=()=>{quantity=Number(input.value);render()};label.append(input);total.textContent='Total: $'+(12*quantity).toFixed(2);remove.textContent='Remove notebook';remove.onclick=()=>{quantity=0;render()};line.append(title,label,total,remove)}document.querySelector('#add').onclick=()=>{quantity++;render()};render();
</script></html>
